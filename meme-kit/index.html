<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>memehole</title>

<!-- iOS home screen / PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="memehole">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f10">

<!-- Icons -->
<link rel="apple-touch-icon" href="/memehole/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="/memehole/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/memehole/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/memehole/icon-512.png">
<link rel="manifest" href="/memehole/manifest.json">

<!-- Background removal library (loads lazily on first use) -->
<script type="module">
  let _removeBgPromise = null;
  window.loadBgRemover = function() {
    if (!_removeBgPromise) {
      _removeBgPromise = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm')
        .then(mod => mod.removeBackground)
        .catch(err => {
          _removeBgPromise = null; // allow retry on next click
          throw err;
        });
    }
    return _removeBgPromise;
  };
</script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation; /* disables iOS double-tap-to-zoom delay */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f10;
    color: #f4f4f5;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  header {
    flex-shrink: 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1f1f23;
  }
  h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  h1 span { color: #ffde59; }
  .stage {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, #2a2a32 0%, #1a1a1f 60%);
  }
  .canvas-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .canvas-inner {
    position: relative;
    display: block;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #2a2a32;
    border: 1px solid #3a3a45;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    width: 100%;
    height: 100%;
  }
  .start-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    position: relative;
  }
  .start-back {
    position: absolute;
    top: 12px;
    left: 12px;
    background: #1f1f25;
    border: 1px solid #2a2a32;
    color: #9b9ba5;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .start-back:active { transform: scale(0.97); }
  .start-title {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: #6b6b75;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .start-card {
    width: 100%;
    max-width: 320px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    background: #18181c;
    border: 2px dashed #3a3a45;
    border-radius: 14px;
    color: #f4f4f5;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.05s;
    font-family: inherit;
  }
  .start-card:active {
    border-color: #ffde59;
    background: #1f1f25;
    transform: scale(0.98);
  }
  .start-card svg {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    color: #6b6b75;
  }
  .start-card:active svg { color: #ffde59; }
  .start-card p { margin: 0; font-size: 17px; font-weight: 600; }
  .start-card p.sub { font-size: 12px; font-weight: 400; color: #6b6b75; margin-top: 4px; }
  .text-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .text-item {
    position: absolute;
    pointer-events: auto;
    cursor: grab;
    padding: 6px 8px;
    color: #fff;
    text-align: center;
    white-space: pre;
    line-height: 1.05;
    letter-spacing: 0.01em;
    -webkit-text-stroke: 2px #000;
    text-shadow:
      2px 2px 0 #000,
      -2px 2px 0 #000,
      2px -2px 0 #000,
      -2px -2px 0 #000;
    transform: translate(-50%, -50%);
    touch-action: none;
    transition: outline 0.1s;
  }
  .text-item.caps { text-transform: uppercase; }
  .delete-handle {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ff5555;
    color: #fff;
    border: 2px solid #0f0f10;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    z-index: 10;
  }
  .selected > .delete-handle { display: flex; }
  .resize-handle {
    position: absolute;
    bottom: -10px;
    right: -10px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffde59;
    border: 2px solid #0f0f10;
    display: none;
    cursor: nwse-resize;
    pointer-events: auto;
    z-index: 10;
    touch-action: none;
  }
  .selected > .resize-handle { display: block; }
  .crop-handle-btn {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ffde59;
    color: #0f0f10;
    border: 2px solid #0f0f10;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    z-index: 10;
  }
  .image-item.selected > .crop-handle-btn { display: flex; }
  .bg-remove-btn {
    position: absolute;
    top: 22px;
    left: -10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #59c9ff;
    color: #0f0f10;
    border: 2px solid #0f0f10;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    z-index: 10;
  }
  .image-item.selected > .bg-remove-btn { display: flex; }
  .image-item {
    position: absolute;
    pointer-events: auto;
    cursor: grab;
    transform: translate(-50%, -50%);
    touch-action: none;
    transition: outline 0.1s;
  }
  .image-item img {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    -webkit-user-drag: none;
    user-drag: none;
  }
  .image-item.selected {
    outline: 2px dashed #ffde59;
    outline-offset: 2px;
  }
  .image-item.dragging { opacity: 0.85; }
  .text-item.selected {
    outline: 2px dashed #ffde59;
    outline-offset: 2px;
    cursor: grabbing;
  }
  .text-item.dragging { opacity: 0.85; }
  .toolbar {
    flex-shrink: 0;
    border-top: 1px solid #1f1f23;
    padding: 10px;
    background: #131317;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .input {
    flex: 1;
    background: #1f1f25;
    border: 1px solid #2a2a32;
    color: #f4f4f5;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 16px; /* 16px+ prevents iOS auto-zoom on focus */
    font-family: inherit;
    outline: none;
    min-width: 0;
  }
  .input:focus { border-color: #ffde59; }
  button {
    background: #1f1f25;
    border: 1px solid #2a2a32;
    color: #f4f4f5;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.05s, background 0.15s;
    white-space: nowrap;
  }
  button:active { transform: scale(0.97); }
  button.primary {
    background: #ffde59;
    color: #0f0f10;
    border-color: #ffde59;
  }
  button.icon {
    padding: 10px 12px;
    min-width: 44px;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .size-controls {
    display: none;
    gap: 6px;
    align-items: center;
    padding: 6px 8px;
    background: #1f1f25;
    border-radius: 10px;
  }
  .size-controls.visible { display: flex; }
  .size-controls span {
    font-size: 11px;
    color: #9b9ba5;
    flex: 1;
  }
  .size-controls button {
    padding: 6px 10px;
    font-size: 15px;
    min-width: 36px;
  }
  input[type="file"] { display: none; }
  .hint {
    font-size: 10px;
    color: #6b6b75;
    text-align: center;
    margin-top: 2px;
  }
  @media (max-height: 600px) {
    .hint { display: none; }
    header { padding: 8px 14px; }
    h1 { font-size: 15px; }
    .toolbar { padding: 8px; gap: 6px; }
    button { padding: 8px 10px; font-size: 13px; }
    .input { padding: 8px 10px; font-size: 16px; } /* keep 16px to prevent iOS zoom */
  }

  /* Crop modal */
  .crop-modal {
    position: fixed;
    inset: 0;
    background: #0f0f10;
    z-index: 100;
    display: none;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .crop-modal.visible { display: flex; }
  .crop-header {
    flex-shrink: 0;
    padding: 12px 16px;
    text-align: center;
    font-size: 14px;
    color: #9b9ba5;
    border-bottom: 1px solid #1f1f23;
  }
  .crop-stage {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    position: relative;
    background: #18181c;
  }
  .crop-image-wrap {
    position: relative;
    display: inline-block;
  }
  .crop-image-wrap img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    -webkit-user-drag: none;
    user-drag: none;
    pointer-events: none;
  }
  .crop-box {
    position: absolute;
    border: 2px solid #ffde59;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    cursor: move;
    touch-action: none;
  }
  .crop-handle {
    position: absolute;
    width: 24px;
    height: 24px;
    background: #ffde59;
    border: 2px solid #0f0f10;
    border-radius: 50%;
    touch-action: none;
  }
  .crop-handle.tl { top: -12px; left: -12px; cursor: nwse-resize; }
  .crop-handle.tr { top: -12px; right: -12px; cursor: nesw-resize; }
  .crop-handle.bl { bottom: -12px; left: -12px; cursor: nesw-resize; }
  .crop-handle.br { bottom: -12px; right: -12px; cursor: nwse-resize; }
  .crop-actions {
    flex-shrink: 0;
    padding: 12px;
    display: flex;
    gap: 8px;
    border-top: 1px solid #1f1f23;
  }
  .crop-actions button { flex: 1; padding: 14px; font-size: 15px; }

  /* Background removal spinner overlay */
  .bg-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 16, 0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .bg-overlay.visible { display: flex; }
  .bg-spinner {
    width: 54px;
    height: 54px;
    border: 4px solid #2a2a32;
    border-top-color: #59c9ff;
    border-radius: 50%;
    animation: bg-spin 0.9s linear infinite;
    margin-bottom: 22px;
  }
  @keyframes bg-spin {
    to { transform: rotate(360deg); }
  }
  .bg-overlay-title {
    font-size: 18px;
    font-weight: 700;
    color: #f4f4f5;
    margin: 0 0 8px;
  }
  .bg-overlay-sub {
    font-size: 13px;
    color: #9b9ba5;
    max-width: 280px;
    line-height: 1.45;
    margin: 0;
  }
  .bg-overlay-sub strong {
    color: #ffde59;
    font-weight: 600;
  }

  /* Color picker modal */
  .color-modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 16, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 150;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .color-modal.visible { display: flex; }
  .color-modal-inner {
    width: 100%;
    max-width: 380px;
    background: #1a1a1f;
    border: 1px solid #2a2a32;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    max-height: 100%;
    overflow-y: auto;
  }
  .color-title {
    margin: 0 0 16px;
    font-size: 17px;
    font-weight: 700;
  }
  .color-section-label {
    margin: 14px 0 8px;
    font-size: 11px;
    font-weight: 600;
    color: #6b6b75;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .color-swatches {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
  }
  .color-swatch {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: transform 0.05s, border-color 0.15s;
    position: relative;
  }
  .color-swatch:active { transform: scale(0.92); }
  .color-swatch.selected {
    border-color: #ffde59;
    box-shadow: 0 0 0 2px #0f0f10 inset;
  }
  .color-swatch.light-edge { border: 2px solid #3a3a45; }
  .color-swatch.light-edge.selected { border-color: #ffde59; }
  .custom-color-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 10px;
    background: #1f1f25;
    border-radius: 10px;
    cursor: pointer;
  }
  .custom-color-row input[type="color"] {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    border-radius: 8px;
    overflow: hidden;
  }
  .custom-color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .custom-color-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
  .custom-color-row span { font-size: 14px; color: #9b9ba5; }
  .aspect-row {
    display: flex;
    gap: 8px;
  }
  .aspect-btn {
    flex: 1;
    background: #1f1f25;
    border: 2px solid #2a2a32;
    border-radius: 10px;
    padding: 12px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: #9b9ba5;
    font-family: inherit;
    transition: border-color 0.15s, color 0.15s, transform 0.05s;
  }
  .aspect-btn:active { transform: scale(0.96); }
  .aspect-btn.selected {
    border-color: #ffde59;
    color: #f4f4f5;
  }
  .aspect-shape {
    background: #3a3a45;
    border-radius: 3px;
    display: block;
  }
  .aspect-btn.selected .aspect-shape { background: #ffde59; }
  .ar-1-1  { width: 28px; height: 28px; }
  .ar-4-5  { width: 24px; height: 30px; }
  .ar-9-16 { width: 18px; height: 32px; }
  .aspect-label { font-size: 12px; font-weight: 600; }
  .color-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .color-actions button { flex: 1; padding: 12px; font-size: 14px; }
</style>

<body>
<div class="app">
  <header>
    <h1>meme<span>hole</span></h1>
    <button id="downloadBtn" disabled>Save</button>
  </header>

  <div class="stage" id="stage">
    <div class="start-screen" id="empty">
      <button class="start-back" id="startBack" onclick="cancelChangeBackground()" style="display:none">← back</button>
      <h2 class="start-title">start with...</h2>
      <button class="start-card" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
        <div>
          <p>a photo</p>
          <p class="sub">camera or gallery</p>
        </div>
      </button>
      <button class="start-card" onclick="openColorPicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3a9 9 0 0 1 0 18c-2 0-3-1-3-2.5s1-2.5 1-4-1-2-2.5-2S3 13 3 12a9 9 0 0 1 9-9z"/>
        </svg>
        <div>
          <p>a solid color</p>
          <p class="sub">pick a swatch + aspect</p>
        </div>
      </button>
    </div>
    <div class="canvas-wrap" id="canvasWrap" style="display:none">
      <div class="canvas-inner" id="canvasInner">
        <canvas id="canvas"></canvas>
        <div class="text-layer" id="textLayer"></div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="size-controls" id="sizeControls">
      <button onclick="cycleFont()" id="fontBtn">Impact</button>
      <button onclick="toggleItemCaps()" id="itemCapsBtn">Aa</button>
      <button onclick="cycleBg()" id="bgBtn">▢</button>
      <button onclick="resizeText(-4)">A-</button>
      <button onclick="resizeText(4)">A+</button>
      <button onclick="deleteText()" title="delete this text">🗑</button>
    </div>
    <div class="row">
      <input type="text" class="input" id="textInput" placeholder="type caption, hit +">
      <button class="primary icon" id="addBtn">+</button>
    </div>
    <div class="row">
      <button class="icon" onclick="changeBackground()">📷 background image</button>
      <button class="icon" onclick="document.getElementById('overlayInput').click()">🖼 add another image</button>
      <button class="icon" onclick="clearAll()">clear</button>
    </div>
    <div class="hint">drag to move · tap to select · ✕ deletes</div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*">
<input type="file" id="overlayInput" accept="image/*">

<div class="crop-modal" id="cropModal">
  <div class="crop-header">drag corners to crop</div>
  <div class="crop-stage" id="cropStage">
    <div class="crop-image-wrap" id="cropImageWrap">
      <img id="cropImage" alt="">
      <div class="crop-box" id="cropBox">
        <div class="crop-handle tl"></div>
        <div class="crop-handle tr"></div>
        <div class="crop-handle bl"></div>
        <div class="crop-handle br"></div>
      </div>
    </div>
  </div>
  <div class="crop-actions">
    <button onclick="cancelCrop()">cancel</button>
    <button class="primary" onclick="applyCrop()">use crop</button>
  </div>
</div>

<!-- Background removal spinner -->
<div class="bg-overlay" id="bgOverlay">
  <div class="bg-spinner"></div>
  <p class="bg-overlay-title" id="bgOverlayTitle">removing background…</p>
  <p class="bg-overlay-sub" id="bgOverlaySub">this only takes a few seconds</p>
</div>

<!-- Color canvas picker -->
<div class="color-modal" id="colorModal">
  <div class="color-modal-inner">
    <h3 class="color-title">pick a background</h3>

    <p class="color-section-label">color</p>
    <div class="color-swatches" id="colorSwatches"></div>
    <label class="custom-color-row">
      <input type="color" id="customColorInput" value="#ffde59">
      <span>custom color…</span>
    </label>

    <p class="color-section-label">size</p>
    <div class="aspect-row" id="aspectRow">
      <button class="aspect-btn selected" data-aspect="1:1">
        <span class="aspect-shape ar-1-1"></span>
        <span class="aspect-label">square</span>
      </button>
      <button class="aspect-btn" data-aspect="4:5">
        <span class="aspect-shape ar-4-5"></span>
        <span class="aspect-label">portrait</span>
      </button>
      <button class="aspect-btn" data-aspect="9:16">
        <span class="aspect-shape ar-9-16"></span>
        <span class="aspect-label">story</span>
      </button>
    </div>

    <div class="color-actions">
      <button onclick="closeColorPicker()">cancel</button>
      <button class="primary" onclick="createColorCanvas()">create</button>
    </div>
  </div>
</div>

<script>
// Prevent accidental zoom on iOS Safari
// (iOS ignores user-scalable=no in the viewport meta, so we block gestures here)
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const canvasWrap = document.getElementById('canvasWrap');
const empty = document.getElementById('empty');
const textLayer = document.getElementById('textLayer');
const textInput = document.getElementById('textInput');
const addBtn = document.getElementById('addBtn');
const downloadBtn = document.getElementById('downloadBtn');
const sizeControls = document.getElementById('sizeControls');
const fileInput = document.getElementById('fileInput');
const overlayInput = document.getElementById('overlayInput');

let img = null;
let texts = []; // { kind:'text', id, text, x, y, size, caps, fontIdx, bgIdx, el }
let images = []; // { kind:'image', id, img, x, y, size, aspect, el }
let selectedId = null;
let nextId = 1;
let bgRemoverWarmed = false; // tracks whether the model has been loaded at least once

// Background styles: cycle through these. Each defines text bg + text color + stroke
const BG_STYLES = [
  { name: '▢',  bg: null,      color: '#fff', stroke: '#000', strokeOn: true  },
  { name: 'Tw', bg: null,      color: '#fff', stroke: null,   strokeOn: false },
  { name: 'Tb', bg: null,      color: '#000', stroke: null,   strokeOn: false },
  { name: '⬜', bg: '#fff',    color: '#000', stroke: null,   strokeOn: false },
  { name: '⬛', bg: '#000',    color: '#fff', stroke: null,   strokeOn: false },
  { name: '🟨', bg: '#ffde59', color: '#000', stroke: null,   strokeOn: false },
];

// Fonts available — name shown on button, fontFamily used for both CSS and canvas
const FONTS = [
  { name: 'Plain',   family: '-apple-system, "Helvetica Neue", Arial, sans-serif', weight: '400', stroke: 0.06 },
  { name: 'Impact',  family: 'Impact, "Arial Black", sans-serif',         weight: 'bold',   stroke: 0.12 },
  { name: 'Serif',   family: 'Georgia, "Times New Roman", serif',          weight: 'bold',   stroke: 0.08 },
  { name: 'Sans',    family: '-apple-system, "Helvetica Neue", Arial, sans-serif', weight: '400', stroke: 0.06 },
  { name: 'Mono',    family: 'Menlo, Monaco, "Courier New", monospace',    weight: 'bold',   stroke: 0.08 },
  { name: 'Script',  family: '"Snell Roundhand", "Brush Script MT", cursive', weight: '400', stroke: 0.07 },
];

function getItem(id) {
  return texts.find(t => t.id === id) || images.find(i => i.id === id);
}

// Background photo upload
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const newImg = new Image();
    newImg.onload = () => {
      img = newImg;
      drawImage();
      empty.style.display = 'none';
      canvasWrap.style.display = 'flex';
      downloadBtn.disabled = false;
      // Reflow existing items after canvas size change
      texts.forEach(t => positionText(t.el, t));
      images.forEach(i => positionImage(i.el, i));
    };
    newImg.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

// Overlay image upload — adds directly, no crop step
overlayInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!img) { flashEmpty(); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const newImg = new Image();
    newImg.onload = () => addImage(newImg);
    newImg.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  overlayInput.value = '';
});

// ---------- BACKGROUND CHANGE (toolbar button) ----------
// Show the start screen again. The back button lets the user return to
// the existing canvas if they change their mind.
function changeBackground() {
  document.getElementById('empty').style.display = 'flex';
  document.getElementById('startBack').style.display = img ? 'block' : 'none';
  canvasWrap.style.display = 'none';
}

function cancelChangeBackground() {
  if (!img) return;
  document.getElementById('empty').style.display = 'none';
  canvasWrap.style.display = 'flex';
}

// ---------- COLOR CANVAS ----------
const SWATCH_COLORS = [
  '#ffffff', '#000000', '#ffde59', '#ff3ea5',
  '#a3ff3c', '#3cd7ff', '#ff7a1a', '#ff2d2d'
];
let selectedColor = '#ffde59';
let selectedAspect = '1:1';

function openColorPicker() {
  // Build swatches once
  const grid = document.getElementById('colorSwatches');
  if (!grid.children.length) {
    SWATCH_COLORS.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'color-swatch';
      // Add a light edge so white is visible on the dark modal
      if (isLightColor(c)) btn.classList.add('light-edge');
      btn.style.background = c;
      btn.dataset.color = c;
      btn.addEventListener('click', () => selectSwatch(c));
      grid.appendChild(btn);
    });
  }
  // Default selection on first open
  selectSwatch(selectedColor);
  selectAspect(selectedAspect);
  document.getElementById('colorModal').classList.add('visible');
}

function closeColorPicker() {
  document.getElementById('colorModal').classList.remove('visible');
}

function selectSwatch(color) {
  selectedColor = color;
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('selected', s.dataset.color === color);
  });
  // Keep the custom picker in sync if the swatch is a hex string
  const custom = document.getElementById('customColorInput');
  if (custom && /^#[0-9a-f]{6}$/i.test(color)) custom.value = color;
}

function selectAspect(aspect) {
  selectedAspect = aspect;
  document.querySelectorAll('.aspect-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.aspect === aspect);
  });
}

// Wire aspect buttons + custom color
document.querySelectorAll('.aspect-btn').forEach(b => {
  b.addEventListener('click', () => selectAspect(b.dataset.aspect));
});
document.getElementById('customColorInput').addEventListener('input', (e) => {
  selectedColor = e.target.value;
  // Deselect any active swatch since we're now using custom
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
});

function isLightColor(hex) {
  // Crude perceived-brightness check for adding a visible border on near-white swatches
  const c = hex.replace('#', '');
  if (c.length !== 6) return false;
  const r = parseInt(c.slice(0, 2), 16);
  const g = parseInt(c.slice(2, 4), 16);
  const b = parseInt(c.slice(4, 6), 16);
  return (r * 0.299 + g * 0.587 + b * 0.114) > 220;
}

function createColorCanvas() {
  // Build an offscreen colored canvas, then load it into the existing img pipeline
  const dims = {
    '1:1':  { w: 1080, h: 1080 },
    '4:5':  { w: 1080, h: 1350 },
    '9:16': { w: 1080, h: 1920 },
  }[selectedAspect] || { w: 1080, h: 1080 };

  const off = document.createElement('canvas');
  off.width = dims.w;
  off.height = dims.h;
  const octx = off.getContext('2d');
  octx.fillStyle = selectedColor;
  octx.fillRect(0, 0, dims.w, dims.h);

  const newImg = new Image();
  newImg.onload = () => {
    img = newImg;
    drawImage();
    document.getElementById('empty').style.display = 'none';
    canvasWrap.style.display = 'flex';
    downloadBtn.disabled = false;
    texts.forEach(t => positionText(t.el, t));
    images.forEach(i => positionImage(i.el, i));
    closeColorPicker();
  };
  newImg.src = off.toDataURL('image/png');
}

// ---------- CROP MODAL ----------
let cropState = null; // { img, naturalW, naturalH, box, targetId|null }

function openCropModal(dataUrl, targetId = null) {
  const cropImage = document.getElementById('cropImage');
  cropImage.onload = () => {
    const wrap = document.getElementById('cropImageWrap');
    requestAnimationFrame(() => {
      const rect = cropImage.getBoundingClientRect();
      wrap.style.width = rect.width + 'px';
      wrap.style.height = rect.height + 'px';
      const inset = 0.1;
      cropState = {
        img: cropImage,
        naturalW: cropImage.naturalWidth,
        naturalH: cropImage.naturalHeight,
        displayW: rect.width,
        displayH: rect.height,
        targetId,
        box: {
          x: rect.width * inset,
          y: rect.height * inset,
          w: rect.width * (1 - inset * 2),
          h: rect.height * (1 - inset * 2),
        },
      };
      renderCropBox();
    });
  };
  cropImage.src = dataUrl;
  document.getElementById('cropModal').classList.add('visible');
}

function renderCropBox() {
  if (!cropState) return;
  const box = document.getElementById('cropBox');
  box.style.left = cropState.box.x + 'px';
  box.style.top = cropState.box.y + 'px';
  box.style.width = cropState.box.w + 'px';
  box.style.height = cropState.box.h + 'px';
}

function cancelCrop() {
  document.getElementById('cropModal').classList.remove('visible');
  cropState = null;
}

function applyCrop() {
  if (!cropState) return;
  const sx = cropState.naturalW / cropState.displayW;
  const sy = cropState.naturalH / cropState.displayH;
  const cx = Math.round(cropState.box.x * sx);
  const cy = Math.round(cropState.box.y * sy);
  const cw = Math.round(cropState.box.w * sx);
  const ch = Math.round(cropState.box.h * sy);

  const off = document.createElement('canvas');
  off.width = cw;
  off.height = ch;
  const octx = off.getContext('2d');
  octx.drawImage(cropState.img, cx, cy, cw, ch, 0, 0, cw, ch);

  const newImg = new Image();
  const targetId = cropState.targetId;
  newImg.onload = () => {
    if (targetId !== null) {
      // Replace the existing image's source and update aspect
      const item = images.find(i => i.id === targetId);
      if (item) {
        item.img = newImg;
        item.aspect = newImg.naturalWidth / newImg.naturalHeight;
        // Update the rendered <img> src and recalc dimensions
        const imgTag = item.el.querySelector('img');
        if (imgTag) imgTag.src = newImg.src;
        positionImage(item.el, item);
      }
    } else {
      addImage(newImg);
    }
    document.getElementById('cropModal').classList.remove('visible');
    cropState = null;
  };
  newImg.src = off.toDataURL('image/png');
}

// Drag crop box body to move
(function attachCropBoxDrag() {
  const box = document.getElementById('cropBox');
  let startX, startY, startBoxX, startBoxY;
  const onMove = (e) => {
    if (!cropState) return;
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - startX;
    const dy = point.clientY - startY;
    let nx = startBoxX + dx;
    let ny = startBoxY + dy;
    nx = Math.max(0, Math.min(cropState.displayW - cropState.box.w, nx));
    ny = Math.max(0, Math.min(cropState.displayH - cropState.box.h, ny));
    cropState.box.x = nx;
    cropState.box.y = ny;
    renderCropBox();
  };
  const onEnd = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  };
  const onStart = (e) => {
    // Ignore drags that start on a corner handle
    if (e.target.classList.contains('crop-handle')) return;
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX;
    startY = point.clientY;
    startBoxX = cropState.box.x;
    startBoxY = cropState.box.y;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
  };
  box.addEventListener('mousedown', onStart);
  box.addEventListener('touchstart', onStart, { passive: false });
})();

// Attach drag to each corner handle for resize
(function attachCropHandles() {
  const handles = document.querySelectorAll('.crop-handle');
  handles.forEach(handle => {
    let startX, startY, startBox;
    const corner =
      handle.classList.contains('tl') ? 'tl' :
      handle.classList.contains('tr') ? 'tr' :
      handle.classList.contains('bl') ? 'bl' : 'br';

    const onMove = (e) => {
      if (!cropState) return;
      e.preventDefault();
      const point = e.touches ? e.touches[0] : e;
      const dx = point.clientX - startX;
      const dy = point.clientY - startY;
      let { x, y, w, h } = startBox;
      const minSize = 30;

      if (corner === 'tl') {
        x = startBox.x + dx;
        y = startBox.y + dy;
        w = startBox.w - dx;
        h = startBox.h - dy;
      } else if (corner === 'tr') {
        y = startBox.y + dy;
        w = startBox.w + dx;
        h = startBox.h - dy;
      } else if (corner === 'bl') {
        x = startBox.x + dx;
        w = startBox.w - dx;
        h = startBox.h + dy;
      } else {
        w = startBox.w + dx;
        h = startBox.h + dy;
      }

      // Clamp to image bounds and min size
      if (w < minSize) {
        if (corner === 'tl' || corner === 'bl') x = startBox.x + startBox.w - minSize;
        w = minSize;
      }
      if (h < minSize) {
        if (corner === 'tl' || corner === 'tr') y = startBox.y + startBox.h - minSize;
        h = minSize;
      }
      if (x < 0) { w += x; x = 0; }
      if (y < 0) { h += y; y = 0; }
      if (x + w > cropState.displayW) w = cropState.displayW - x;
      if (y + h > cropState.displayH) h = cropState.displayH - y;

      cropState.box = { x, y, w, h };
      renderCropBox();
    };
    const onEnd = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
    };
    const onStart = (e) => {
      e.stopPropagation();
      e.preventDefault();
      const point = e.touches ? e.touches[0] : e;
      startX = point.clientX;
      startY = point.clientY;
      startBox = { ...cropState.box };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    };
    handle.addEventListener('mousedown', onStart);
    handle.addEventListener('touchstart', onStart, { passive: false });
  });
})();

// ---------- BACKGROUND REMOVAL ----------
function showBgOverlay(isFirstRun) {
  const overlay = document.getElementById('bgOverlay');
  const title = document.getElementById('bgOverlayTitle');
  const sub = document.getElementById('bgOverlaySub');
  if (isFirstRun) {
    title.textContent = 'loading background remover…';
    sub.innerHTML = 'first time setup downloads the model — this can take <strong>up to 30 seconds</strong>. after this, removals take 2–10 seconds.';
  } else {
    title.textContent = 'removing background…';
    sub.textContent = 'this usually takes 2–10 seconds';
  }
  overlay.classList.add('visible');
}

function hideBgOverlay() {
  document.getElementById('bgOverlay').classList.remove('visible');
}

async function removeImageBackground(item) {
  const isFirstRun = !bgRemoverWarmed;
  showBgOverlay(isFirstRun);
  try {
    const removeBackground = await window.loadBgRemover();
    // After first successful load, mark as warm so future calls show the fast message
    if (isFirstRun) {
      // Update mid-run once the model is loaded — actual removal still pending
      const title = document.getElementById('bgOverlayTitle');
      const sub = document.getElementById('bgOverlaySub');
      title.textContent = 'removing background…';
      sub.textContent = 'almost there';
    }
    const blob = await removeBackground(item.img.src);
    bgRemoverWarmed = true;
    const url = URL.createObjectURL(blob);
    await new Promise((resolve, reject) => {
      const newImg = new Image();
      newImg.onload = () => {
        item.img = newImg;
        item.aspect = newImg.naturalWidth / newImg.naturalHeight;
        const imgTag = item.el.querySelector('img');
        if (imgTag) imgTag.src = newImg.src;
        positionImage(item.el, item);
        resolve();
      };
      newImg.onerror = reject;
      newImg.src = url;
    });
  } catch (err) {
    console.error('background removal failed', err);
    const detail = (err && err.message) ? err.message : String(err);
    alert('background removal failed:\n\n' + detail + '\n\ncheck your connection and try again');
  } finally {
    hideBgOverlay();
  }
}

function drawImage() {
  if (!img) return;
  const maxW = 1200;
  const maxH = 1200;
  let w = img.naturalWidth;
  let h = img.naturalHeight;
  if (w > maxW || h > maxH) {
    const ratio = Math.min(maxW / w, maxH / h);
    w = Math.round(w * ratio);
    h = Math.round(h * ratio);
  }
  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(img, 0, 0, w, h);
  fitCanvasInner();
}

function fitCanvasInner() {
  if (!img) return;
  const inner = document.getElementById('canvasInner');
  const stage = document.getElementById('stage');
  const stageRect = stage.getBoundingClientRect();
  const availW = stageRect.width - 24;
  const availH = stageRect.height - 24;
  const aspect = canvas.width / canvas.height;

  // Don't display larger than the canvas's actual pixel size
  let w = Math.min(availW, canvas.width);
  let h = w / aspect;
  if (h > availH) {
    h = Math.min(availH, canvas.height);
    w = h * aspect;
  }
  // Also clamp width again in case h-cap pushed w over canvas.width
  if (w > canvas.width) {
    w = canvas.width;
    h = w / aspect;
  }
  inner.style.width = w + 'px';
  inner.style.height = h + 'px';
}

// ---------- TEXT ----------
addBtn.addEventListener('click', addText);
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addText();
});

function addText() {
  const value = textInput.value.trim();
  if (!value || !img) {
    if (!img) flashEmpty();
    return;
  }
  const id = nextId++;
  const item = {
    kind: 'text',
    id,
    text: value,
    x: 50,
    y: texts.length === 0 ? 12 : (texts.length === 1 ? 88 : 50),
    size: 8,
    caps: false,
    fontIdx: 0,
    bgIdx: 1, // plain white text by default; ▢ button cycles to meme style + others
  };
  texts.push(item);
  renderText(item);
  selectItem(id);
  textInput.value = '';
}

function renderText(item) {
  let el = document.querySelector(`[data-id="${item.id}"]`);
  if (!el) {
    el = document.createElement('div');
    el.className = 'text-item';
    el.dataset.id = item.id;
    textLayer.appendChild(el);
    attachDrag(el, item, 'text');
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      selectItem(item.id);
    });
    // Inline delete handle
    const del = document.createElement('div');
    del.className = 'delete-handle';
    del.textContent = '✕';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteItem(item.id);
    });
    del.addEventListener('mousedown', (e) => e.stopPropagation());
    del.addEventListener('touchstart', (e) => e.stopPropagation());
    el.appendChild(del);
    // Resize handle
    const resize = document.createElement('div');
    resize.className = 'resize-handle';
    attachTextResize(resize, item);
    el.appendChild(resize);
  }
  // Update text content while preserving handles
  const del = el.querySelector('.delete-handle');
  const resize = el.querySelector('.resize-handle');
  el.childNodes.forEach(n => {
    if (n !== del && n !== resize) n.remove();
  });
  el.insertBefore(document.createTextNode(item.text), del);
  el.classList.toggle('caps', item.caps);
  const font = FONTS[item.fontIdx || 0];
  el.style.fontFamily = font.family;
  el.style.fontWeight = font.weight;
  applyBgStyle(el, item);
  positionText(el, item);
  item.el = el;
}

function applyBgStyle(el, item) {
  const style = BG_STYLES[item.bgIdx || 0];
  if (style.bg) {
    el.style.background = style.bg;
    el.style.padding = '0.15em 0.4em';
    el.style.borderRadius = '0.08em';
  } else {
    el.style.background = '';
    el.style.padding = '6px 8px';
    el.style.borderRadius = '';
  }
  el.style.color = style.color;
  if (style.strokeOn) {
    el.style.webkitTextStroke = '2px #000';
    el.style.textShadow = '2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000';
  } else {
    el.style.webkitTextStroke = '0';
    el.style.textShadow = 'none';
  }
}

function toggleItemCaps() {
  const item = getItem(selectedId);
  if (!item || item.kind !== 'text') return;
  item.caps = !item.caps;
  item.el.classList.toggle('caps', item.caps);
  updateItemCapsBtn(item);
}

function updateItemCapsBtn(item) {
  const btn = document.getElementById('itemCapsBtn');
  if (!btn) return;
  btn.textContent = item.caps ? 'AA' : 'aa';
}

function cycleFont() {
  const item = getItem(selectedId);
  if (!item || item.kind !== 'text') return;
  item.fontIdx = ((item.fontIdx || 0) + 1) % FONTS.length;
  const font = FONTS[item.fontIdx];
  item.el.style.fontFamily = font.family;
  item.el.style.fontWeight = font.weight;
  updateFontBtn(item);
}

function updateFontBtn(item) {
  const btn = document.getElementById('fontBtn');
  if (!btn) return;
  btn.textContent = FONTS[item.fontIdx || 0].name;
}

function cycleBg() {
  const item = getItem(selectedId);
  if (!item || item.kind !== 'text') return;
  item.bgIdx = ((item.bgIdx || 0) + 1) % BG_STYLES.length;
  applyBgStyle(item.el, item);
  updateBgBtn(item);
}

function updateBgBtn(item) {
  const btn = document.getElementById('bgBtn');
  if (!btn) return;
  btn.textContent = BG_STYLES[item.bgIdx || 0].name;
}

function positionText(el, item) {
  el.style.left = item.x + '%';
  el.style.top = item.y + '%';
  const canvasRect = canvas.getBoundingClientRect();
  const fontPx = Math.max(12, canvasRect.height * (item.size / 100));
  el.style.fontSize = fontPx + 'px';
}

function resizeText(delta) {
  const item = getItem(selectedId);
  if (!item || item.kind !== 'text') return;
  item.size = Math.max(3, Math.min(30, item.size + delta));
  positionText(item.el, item);
}

// ---------- IMAGE OVERLAY ----------
function addImage(imgEl) {
  const id = nextId++;
  const aspect = imgEl.naturalWidth / imgEl.naturalHeight;
  // Offset each new image so they don't stack invisibly
  const offset = (images.length % 5) * 6;
  const item = {
    kind: 'image',
    id,
    img: imgEl,
    x: 50 + offset,
    y: 50 + offset,
    size: 35,
    aspect,
  };
  images.push(item);
  renderImage(item);
  selectItem(id);
}

function renderImage(item) {
  // Always create a fresh element — don't reuse
  const el = document.createElement('div');
  el.className = 'image-item';
  el.dataset.id = item.id;
  const imgTag = document.createElement('img');
  imgTag.src = item.img.src;
  el.appendChild(imgTag);
  textLayer.appendChild(el);
  attachDrag(el, item, 'image');
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    selectItem(item.id);
  });
  // Delete handle (top right)
  const del = document.createElement('div');
  del.className = 'delete-handle';
  del.textContent = '✕';
  del.addEventListener('click', (e) => {
    e.stopPropagation();
    deleteItem(item.id);
  });
  del.addEventListener('mousedown', (e) => e.stopPropagation());
  del.addEventListener('touchstart', (e) => e.stopPropagation());
  el.appendChild(del);
  // Crop button (top left)
  const cropBtn = document.createElement('div');
  cropBtn.className = 'crop-handle-btn';
  cropBtn.textContent = '✂';
  cropBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openCropModal(item.img.src, item.id);
  });
  cropBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  cropBtn.addEventListener('touchstart', (e) => e.stopPropagation());
  el.appendChild(cropBtn);
  // Background remove button (below crop)
  const bgBtn = document.createElement('div');
  bgBtn.className = 'bg-remove-btn';
  bgBtn.textContent = '✨';
  bgBtn.title = 'remove background';
  bgBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    removeImageBackground(item);
  });
  bgBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  bgBtn.addEventListener('touchstart', (e) => e.stopPropagation());
  el.appendChild(bgBtn);
  // Resize handle (bottom right)
  const resize = document.createElement('div');
  resize.className = 'resize-handle';
  attachResize(resize, item);
  el.appendChild(resize);
  positionImage(el, item);
  item.el = el;
}

function positionImage(el, item) {
  const canvasRect = canvas.getBoundingClientRect();
  const widthPx = canvasRect.width * (item.size / 100);
  const heightPx = widthPx / item.aspect;
  el.style.left = item.x + '%';
  el.style.top = item.y + '%';
  el.style.width = widthPx + 'px';
  el.style.height = heightPx + 'px';
}

function attachResize(handle, item) {
  let startX, startY, startSize;
  const onMove = (e) => {
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - startX;
    const rect = canvas.getBoundingClientRect();
    const deltaPct = (dx / rect.width) * 100;
    item.size = Math.max(5, Math.min(150, startSize + deltaPct * 2));
    positionImage(item.el, item);
  };
  const onEnd = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  };
  const onStart = (e) => {
    e.stopPropagation();
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX;
    startY = point.clientY;
    startSize = item.size;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
  };
  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, { passive: false });
}

function attachTextResize(handle, item) {
  let startX, startY, startSize;
  const onMove = (e) => {
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - startX;
    const dy = point.clientY - startY;
    const rect = canvas.getBoundingClientRect();
    // Use diagonal distance so dragging out grows, dragging in shrinks
    const delta = (dx + dy) / 2;
    const deltaPct = (delta / rect.height) * 100;
    item.size = Math.max(3, Math.min(30, startSize + deltaPct));
    positionText(item.el, item);
  };
  const onEnd = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  };
  const onStart = (e) => {
    e.stopPropagation();
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX;
    startY = point.clientY;
    startSize = item.size;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
  };
  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, { passive: false });
}

// ---------- SELECTION ----------
function selectItem(id) {
  selectedId = id;
  document.querySelectorAll('.text-item, .image-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id == id);
  });
  const item = getItem(id);
  // Only show toolbar with caps/size/font buttons for text
  if (item && item.kind === 'text') {
    sizeControls.classList.add('visible');
    updateItemCapsBtn(item);
    updateFontBtn(item);
    updateBgBtn(item);
  } else {
    sizeControls.classList.remove('visible');
  }
}

function deselect() {
  selectedId = null;
  document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
  sizeControls.classList.remove('visible');
}

canvasWrap.addEventListener('click', (e) => {
  if (e.target === canvasWrap || e.target === canvas || e.target === textLayer) {
    deselect();
  }
});

function deleteItem(id) {
  const tIdx = texts.findIndex(t => t.id === id);
  if (tIdx !== -1) {
    texts[tIdx].el.remove();
    texts.splice(tIdx, 1);
  }
  const iIdx = images.findIndex(i => i.id === id);
  if (iIdx !== -1) {
    images[iIdx].el.remove();
    images.splice(iIdx, 1);
  }
  if (selectedId === id) deselect();
}

function deleteText() { // kept for size-controls trash button
  if (selectedId !== null) deleteItem(selectedId);
}

function clearAll() {
  texts.forEach(t => t.el.remove());
  images.forEach(i => i.el.remove());
  texts = [];
  images = [];
  deselect();
}

function flashEmpty() {
  empty.style.color = '#ff6b6b';
  setTimeout(() => empty.style.color = '', 600);
}

// ---------- DRAG ----------
function attachDrag(el, item, kind) {
  let startX, startY, startPctX, startPctY;
  let dragging = false;

  const onMove = (e) => {
    if (!dragging) return;
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - startX;
    const dy = point.clientY - startY;
    const rect = canvas.getBoundingClientRect();
    item.x = Math.max(0, Math.min(100, startPctX + (dx / rect.width) * 100));
    item.y = Math.max(0, Math.min(100, startPctY + (dy / rect.height) * 100));
    if (kind === 'text') positionText(el, item);
    else positionImage(el, item);
  };

  const onEnd = () => {
    dragging = false;
    el.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  };

  const onStart = (e) => {
    // Ignore drags that started on the delete, resize, crop, or bg-remove handle
    if (e.target.classList.contains('delete-handle') ||
        e.target.classList.contains('resize-handle') ||
        e.target.classList.contains('crop-handle-btn') ||
        e.target.classList.contains('bg-remove-btn')) return;
    e.stopPropagation();
    selectItem(item.id);
    dragging = true;
    el.classList.add('dragging');
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX;
    startY = point.clientY;
    startPctX = item.x;
    startPctY = item.y;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
  };

  el.addEventListener('mousedown', onStart);
  el.addEventListener('touchstart', onStart, { passive: true });
}

// Reposition on window resize
window.addEventListener('resize', () => {
  fitCanvasInner();
  texts.forEach(t => positionText(t.el, t));
  images.forEach(i => positionImage(i.el, i));
});

// ---------- DOWNLOAD ----------
downloadBtn.addEventListener('click', () => {
  if (!img) return;
  drawImage();
  const canvasRect = canvas.getBoundingClientRect();
  const scale = canvas.width / canvasRect.width;

  // Render images first (under text)
  images.forEach(item => {
    const widthPx = canvasRect.width * (item.size / 100) * scale;
    const heightPx = widthPx / item.aspect;
    const cx = (item.x / 100) * canvas.width;
    const cy = (item.y / 100) * canvas.height;
    ctx.drawImage(item.img, cx - widthPx / 2, cy - heightPx / 2, widthPx, heightPx);
  });

  // Then text on top
  texts.forEach(item => {
    const fontPx = Math.max(12, canvasRect.height * (item.size / 100)) * scale;
    const font = FONTS[item.fontIdx || 0];
    const bgStyle = BG_STYLES[item.bgIdx || 0];
    ctx.font = `${font.weight} ${fontPx}px ${font.family}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    const x = (item.x / 100) * canvas.width;
    const y = (item.y / 100) * canvas.height;
    const renderedText = item.caps ? item.text.toUpperCase() : item.text;

    // Draw background box if BG style has one
    if (bgStyle.bg) {
      const metrics = ctx.measureText(renderedText);
      const textW = metrics.width;
      const textH = fontPx * 1.05; // matches CSS line-height
      const padX = fontPx * 0.4;
      const padY = fontPx * 0.15;
      const boxW = textW + padX * 2;
      const boxH = textH + padY * 2;
      ctx.fillStyle = bgStyle.bg;
      const radius = fontPx * 0.08;
      roundRect(ctx, x - boxW / 2, y - boxH / 2, boxW, boxH, radius);
      ctx.fill();
    }

    // Draw stroke + fill text
    if (bgStyle.strokeOn) {
      ctx.lineWidth = fontPx * font.stroke;
      ctx.strokeStyle = bgStyle.stroke || '#000';
      ctx.strokeText(renderedText, x, y);
    }
    ctx.fillStyle = bgStyle.color;
    ctx.fillText(renderedText, x, y);
  });

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  canvas.toBlob(async (blob) => {
    const filename = `meme-${Date.now()}.png`;
    const file = new File([blob], filename, { type: 'image/png' });

    // On iOS, this brings up the share sheet with "Save Image" → camera roll
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        drawImage();
        return;
      } catch (err) {
        // User cancelled or share failed — fall through to download
        if (err.name === 'AbortError') {
          drawImage();
          return;
        }
      }
    }

    // Fallback: regular download (desktop, or share unsupported)
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    drawImage();
  }, 'image/png');
});
</script>
</body>
