<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Infinite Jest</title>
<style>
  :root{
    --sky-top:#2e5fc0;
    --sky-mid:#4f86d4;
    --sky-bot:#8cc0ee;
    --jest:#cfe01f;
    --F:5;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#06122b;overflow:hidden}
  body{font-family:"Helvetica Neue","Arial Narrow",Arial,sans-serif}

  .scene{position:fixed;inset:0;overflow:hidden;background:#06122b}

  /* the thing that zooms. sized to COVER the viewport at scale 1 (book is 2:3) */
  .zoomer{
    --s:max(50vw, 33.34vh);
    position:absolute;
    left:50%; top:50%;
    width:calc(2 * var(--s));
    height:calc(3 * var(--s));
    margin-left:calc(-1 * var(--s));
    margin-top:calc(-1.5 * var(--s));
    transform-origin:50% 50%;
    animation:dive var(--dur,7s) linear infinite;
  }
  .scene.paused .zoomer{animation-play-state:paused}

  /* exponential scale 1 -> 5 so perceived zoom speed stays constant.
     because every cover is self-similar, at scale 5 the nested copy
     exactly matches the start frame -> the loop is seamless. */
  @keyframes dive{
    0%   {transform:scale(1)}
    10%  {transform:scale(1.1746)}
    20%  {transform:scale(1.3797)}
    30%  {transform:scale(1.6206)}
    40%  {transform:scale(1.9037)}
    50%  {transform:scale(2.2360)}
    60%  {transform:scale(2.6266)}
    70%  {transform:scale(3.0852)}
    80%  {transform:scale(3.6239)}
    90%  {transform:scale(4.2567)}
    100% {transform:scale(5)}
  }

  /* ---- one book cover, fully self-contained, scales via container units ---- */
  .cover{
    position:absolute;
    inset:0;
    container-type:size;
    overflow:hidden;
    background:linear-gradient(177deg,var(--sky-top) 0%,var(--sky-mid) 46%,var(--sky-bot) 100%);
    box-shadow:0 0 6cqw rgba(0,0,0,.15) inset;
  }

  /* title block, tilted up to the right, cut off at the top edge */
  .title{
    position:absolute;
    top:-7cqh; left:-3cqw; right:-3cqw;
    transform:rotate(-7deg);
    transform-origin:0 0;
    line-height:.82;
    z-index:2;
  }
  .title b{
    display:block;
    color:var(--jest);
    font-weight:800;
    letter-spacing:-0.015em;
    transform:scaleX(.82);
    transform-origin:left;
    font-size:30cqw;
    text-shadow:0 0.4cqw 0.6cqw rgba(0,0,0,.08);
  }
  .title .l2{margin-top:-1.5cqh}

  /* cloud */
  .cloud{
    position:absolute;
    left:50%; top:50%;
    width:42cqw;
    transform:translate(-50%,-50%);
    z-index:1;
    filter:drop-shadow(0 1cqw 2cqw rgba(0,40,90,.18));
  }
  .cloud svg{display:block;width:100%;height:auto}

  /* bottom text stack */
  .credits{
    position:absolute;
    left:0; right:0; bottom:3.2cqh;
    text-align:center;
    color:#fff;
    z-index:3;
    padding:0 5cqw;
  }
  .bestseller{font-weight:800;letter-spacing:.18em;font-size:4.4cqw;margin-bottom:3.4cqh}
  .author{font-weight:800;letter-spacing:.02em;font-size:9cqw;transform:scaleX(.92);margin-bottom:.6cqh}
  .foreword{font-weight:500;font-size:3.4cqw;letter-spacing:.02em;margin-bottom:2.6cqh}
  .foreword b{font-weight:800}
  .blurb{font-style:italic;font-size:3cqw;line-height:1.25;letter-spacing:.01em;max-width:84cqw;margin:0 auto}
  .blurb i{font-style:italic}
  .blurb .src{font-style:normal;font-weight:800}

  /* the recursion: a tiny copy of the whole cover, dead-centre, 1/F size */
  .nested{
    position:absolute;
    left:40%; top:40%;
    width:20%; height:20%;
    z-index:4;
    overflow:hidden;
    box-shadow:0 0 0 .35cqw rgba(255,255,255,.9),
               0 1cqw 3cqw rgba(0,0,0,.35);
  }

  /* fixed chrome that does NOT zoom */
  .chrome{
    position:fixed; left:14px; top:12px; right:14px; z-index:50;
    display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12px; color:rgba(255,255,255,.82);
    mix-blend-mode:difference; user-select:none;
  }
  .chrome .mark{letter-spacing:.04em}
  .chrome button{
    font:inherit; color:inherit; background:transparent;
    border:1px solid rgba(255,255,255,.35); border-radius:999px;
    padding:3px 10px; cursor:pointer; transition:background .15s;
  }
  .chrome button:hover{background:rgba(255,255,255,.12)}
  /* sound button: opt out of the difference blend and make it pop orange */
  .chrome #sound{
    mix-blend-mode:normal;
    background:#ff7a18;
    color:#161616;
    border-color:#ff7a18;
    font-weight:700;
    padding:5px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  .chrome #sound:hover{background:#ff8c38}
  .chrome input[type=range]{width:120px; accent-color:#cfe01f; cursor:pointer}
  .chrome .val{min-width:34px; opacity:.7}
  .hint{
    position:fixed; right:14px; bottom:12px; z-index:50;
    font-family:ui-monospace,Menlo,monospace; font-size:11px;
    color:rgba(255,255,255,.55); mix-blend-mode:difference; pointer-events:none;
  }

  @media (prefers-reduced-motion:reduce){
    .zoomer{animation-duration:22s}
  }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="zoomer" id="zoomer"></div>
  </div>

  <div class="chrome">
    <span class="mark">∞ INFINITE INFINITE JEST</span>
    <button id="toggle" aria-label="pause or play">pause</button>
    <span style="opacity:.6">speed</span>
    <input id="speed" type="range" min="0.3" max="50" step="0.1" value="23.5" aria-label="zoom speed">
    <span class="val" id="val">23.5×</span>
    <button id="sound" aria-label="toggle sound">🔊 sound</button>
  </div>
  <audio id="snd" src="infinite-jest.mp3" loop preload="auto"></audio>
  <div class="hint">a david foster wallace novel, all the way down</div>

<script>
  const ART = `
    <div class="title"><b>INFINITE</b><b class="l2">JEST</b></div>
    <div class="cloud">
      <svg viewBox="0 0 240 130" xmlns="http://www.w3.org/2000/svg">
        <g fill="#ffffff">
          <ellipse cx="120" cy="92" rx="92"  ry="30"/>
          <ellipse cx="78"  cy="74" rx="42"  ry="34"/>
          <ellipse cx="128" cy="58" rx="52"  ry="44"/>
          <ellipse cx="176" cy="78" rx="40"  ry="32"/>
          <ellipse cx="120" cy="100" rx="98" ry="22"/>
        </g>
      </svg>
    </div>
    <div class="credits">
      <div class="bestseller">NATIONAL BESTSELLER</div>
      <div class="author">DAVID FOSTER WALLACE</div>
      <div class="foreword">With a foreword by <b>TOM BISSELL</b></div>
      <div class="blurb">
        <i>"Uproarious.…Infinite Jest shows off Wallace as one of the big talents
        of his generation, a writer of virtuosic talents who can seemingly do
        anything."</i> <span class="src">—New York Times</span>
      </div>
    </div>`;

  function buildCover(depth){
    const cover = document.createElement('div');
    cover.className = 'cover';
    cover.innerHTML = ART;
    if (depth > 0){
      const nest = document.createElement('div');
      nest.className = 'nested';
      nest.appendChild(buildCover(depth - 1));
      cover.appendChild(nest);
    }
    return cover;
  }

  document.getElementById('zoomer').appendChild(buildCover(6));

  const scene  = document.getElementById('scene');
  const toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const paused = scene.classList.toggle('paused');
    toggle.textContent = paused ? 'play' : 'pause';
  });

  const speed = document.getElementById('speed');
  const val   = document.getElementById('val');
  function applySpeed(){
    const v = parseFloat(speed.value);
    document.documentElement.style.setProperty('--dur', (7 / v) + 's');
    val.textContent = v.toFixed(1) + '×';
  }
  speed.addEventListener('input', applySpeed);
  applySpeed();

  // sound: browsers block autoplay until a click, so this button starts it
  const snd   = document.getElementById('snd');
  const sound = document.getElementById('sound');
  sound.addEventListener('click', () => {
    if (snd.paused){
      snd.play().then(() => { sound.textContent = '🔈 mute'; })
                .catch(() => { sound.textContent = '⚠ no file'; });
    } else {
      snd.pause();
      sound.textContent = '🔊 sound';
    }
  });
</script>
</body>
</html>
